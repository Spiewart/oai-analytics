# Project configuration for oai-analytics. Non-secret, committed.
# Machine-specific paths belong in .env (see .env.example); [paths] below is a
# last-resort fallback and is normally left commented out.

# [paths]
# data_dir = "/path/to/OAI Complete Data_ASCII"
# work_dir = "/path/to/oai-work"

# Visit-code map (docs/reference/oai-dataset-table-structure.md). V02/V04/V07/V09 are
# telephone contacts. V11-V14 are the extended follow-up, confirmed 2026-10-12: the median
# V##VISDYS is 107.5, 122.5, 168.9 and 192.4 months; the release comments name V13 "Year 14"
# (AllClinical13_ReleaseComments_Yr14.pdf, whose SAS code reads "Year14 (168m)") and V14
# "Y16". Contact follows the measures each visit carries: V11 and V14 have questionnaires
# only ("remote"), V12 a clinic exam, and V13 a questionnaire for all and an exam (BMI,
# 20-m walk) for about 600 of 2,781 ("mixed"). Prefer V##VISDYS over nominal months (V01 spells it V01visdys,
# which to_long() normalizes).
[visits]
V00 = { month = 0, contact = "clinic", verified = true }
V01 = { month = 12, contact = "clinic", verified = true }
V02 = { month = 18, contact = "phone", verified = true }
V03 = { month = 24, contact = "clinic", verified = true }
V04 = { month = 30, contact = "phone", verified = true }
V05 = { month = 36, contact = "clinic", verified = true }
V06 = { month = 48, contact = "clinic", verified = true }
V07 = { month = 60, contact = "phone", verified = true }
V08 = { month = 72, contact = "clinic", verified = true }
V09 = { month = 84, contact = "phone", verified = true }
V10 = { month = 96, contact = "clinic", verified = true }
V11 = { month = 108, contact = "remote", verified = true }
V12 = { month = 120, contact = "clinic", verified = true }
V13 = { month = 168, contact = "mixed", verified = true }
V14 = { month = 192, contact = "remote", verified = true }

# Rules applied by `oai check-egress` before anything leaves the enclave (docs/egress.md).
# Identifier findings always block. Small cells are advisory by default: OAI/NDA and
# dbGaP set no minimum cell size and NIH treats aggregate genomic summary results as
# releasable, so retention is favored. Use "fail" if a journal/collaborator requires it.
[egress]
small_cell = "warn"  # off | warn | fail
min_cell = 5         # counts 1..min_cell-1 are flagged
# Columns (and JSON keys, e.g. run_info.json's git_commit) whose values legitimately look
# like 7-digit numbers: GWAS base-pair positions, git commit hashes.
ignore_id_pattern_columns = ["POS", "BP", "position", "git_commit"]
