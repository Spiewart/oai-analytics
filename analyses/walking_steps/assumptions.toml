# Assumptions for walking from per-minute steps: how much of the GT1M activity counts is walking,
# and how self-reported walking (the 96-month item, PASE walking at 48, 72 and 96 months)
# agrees with count-based and step-based device walking.
# Per-minute steps (oai.steps) classify each wear minute as walking or not; the step
# reports what share of the count-based measures fall in walking minutes.
# Wear, intensity and bout rules are the release's, as in analyses/walking_validation.

[device.nonwear_minutes]
value = 90
status = "confirmed"
source = "AccelData_Descrip.pdf (non-wear >90 zero minutes); >= 90 within each calendar day reproduces the release's by-day files"
rationale = "Validated for knee-OA wear patterns; 60 is the NHANES rule"
alternatives = [60]

[device.interrupt_minutes]
value = 2
status = "confirmed"
source = "AccelData_Descrip.pdf: interruptions of up to 2 consecutive minutes"

[device.interrupt_ceiling]
value = 100
status = "confirmed"
source = "AccelData_Descrip.pdf: interruptions have counts < 100"

[device.valid_day_hours]
value = 10.0
status = "confirmed"
source = "AccelData_Descrip.pdf: valid day = >= 10 wear hours"

[device.max_valid_days]
value = 7
status = "confirmed"
source = "AccelData_Descrip.pdf: only the first 7 valid days are used"

[device.min_valid_days]
value = 4
status = "confirmed"
source = "Accelerometry_Descrip.pdf: 4-7 valid days"

[device.mv_cutpoint]
value = 2020
status = "confirmed"
source = "Troiano 2008 cutpoint, as in the release"

[device.light_floor]
value = 100
status = "confirmed"
source = "Troiano 2008 light intensity 100-2019 counts/min, as in the release"

[device.bout_window]
value = 10
status = "confirmed"
source = "AccelData_Descrip.pdf: MV bout rolling window of 10 minutes"

[device.bout_need]
value = 8
status = "confirmed"
source = "AccelData_Descrip.pdf: a bout is established when 8 of 10 minutes are at or above the cutpoint"

[device.bout_stop_below]
value = 3
status = "confirmed"
source = "AccelData_Descrip.pdf: the bout stops when 3 minutes in the 10-minute window are below the cutpoint"

[device.purposeful_bout_minutes]
value = 10
status = "assumed"
source = "Spec 5: purposeful walking proxy = minutes in >= 10-minute MV bouts"


[steps.day_rule]
value = "complete"
status = "confirmed"
source = "User decision 2026-11-12 (oai.derive.accel.step_day_usable)"
rationale = "A valid day with any wear minute lacking steps is left out of the step analysis; 4 valid days across both waves are partly missing. Days are still chosen by wear alone."
choices = ["complete"]

[sample.min_step_days]
value = 4
status = "assumed"
source = "Mirrors device.min_valid_days: a person counts when at least this many of their first valid days have complete steps"
rationale = "Keeps the per-person shares on the same footing as the release's valid-person rule."
alternatives = [1]
choices = [1, 4]

[walking.cadences]
value = [1, 20, 40, 60, 80, 100]
status = "assumed"
source = "Tudor-Locke & Rowe 2012 (Sports Med 42:381, doi:10.2165/11599170-000000000-00000): NHANES cadence bands 0, 1-59, 60-79, 80-99, 100-119, 120+; 100 steps/min ~ moderate intensity (>= 3 METs). 20 and 40 split the 1-59 band"
rationale = "Every share is reported at each threshold, so no single definition of a walking minute is built into the outputs."

[walking.primary_cadence]
value = 40
status = "open"
source = "No published threshold for a walking minute; 60 = the lowest NHANES walking band and 100 = moderate intensity (Tudor-Locke & Rowe 2012). 40 is this ledger's choice, to allow for minutes only partly spent walking"
rationale = "The threshold used for the headline sentence in WALKING_SHARE.md. A minute only partly spent walking shows a diluted cadence (30 s at 100 steps/min records 50 steps), so higher thresholds understate walking."
alternatives = [60, 100]
choices = [40, 60, 100]

[walking.band_edges]
value = [1, 20, 40, 60, 80, 100, 120]
status = "assumed"
source = "20-step bands: Tudor-Locke & Rowe 2012's 60-79 to 120+ bands, with 1-59 split at 20 and 40"
rationale = "Lower edges of the cadence bands in cadence_bands.csv; 0 steps is its own band."

[relation.count_bin_edges]
value = [0, 100, 500, 1000, 1500, 2020, 5999]
status = "confirmed"
source = "User's choice (2026-11-13): sedentary < 100, light 100-2019 in four equal-width bins, moderate 2020-5998, vigorous >= 5999 (Troiano 2008 vigorous cutpoint)"
rationale = "Lower edges of the activity-count bins for the steps-vs-counts plots (step relation). Must include device.light_floor and device.mv_cutpoint."

[relation.hex_x_quantile]
value = 0.999
status = "assumed"
source = "The hexbin x-axis stops at this quantile of wear-minute counts per wave; the share of minutes beyond is reported"

[relation.hex_gridsize]
value = 50
status = "assumed"
source = "Hexagons across the hexbin x-axis; rows = round(50 / sqrt(3))"

[relation.hex_min_people]
value = 10
status = "assumed"
source = "As walking_validation components.min_cell_count: hexagons with minutes from fewer participants are not written (their share is reported as share_suppressed), so the hexbin stays aggregate"

[reference.step_cadences]
value = [40, 60, 100]
status = "assumed"
source = "Step walking bouts at three cadences: 40 (this ledger's walking minute), 60 (lowest NHANES walking band) and 100 steps/min (moderate intensity; Tudor-Locke & Rowe 2012)"
rationale = "Every cadence is reported beside the count-based MV bouts, so no single step definition is built in."

[reference.min_bout_days_per_week]
value = 2.0
status = "assumed"
source = "As walking_validation reference.min_bout_days_per_week (device habitual walker = >= 2 bout-days per valid week)"

[reference.min_bout_minutes_per_week]
value = 150.0
status = "assumed"
source = "As walking_validation reference.min_bout_minutes_per_week (DHHS 2008 aerobic guideline volume)"

[exposure.yes_without_amount_as]
value = "non-walker"
status = "open"
source = "As walking_validation exposure.yes_without_amount_as (reproduces Lo 2022's 887 walkers); question for the original authors in TODO.md"
choices = ["walker", "non-walker", "exclude"]

[pase.walking_scoring]
value = { days = [0.0, 1.5, 3.5, 6.0], hours = [0.5, 1.5, 3.0, 5.0], weight = 20.0 }
status = "assumed"
source = "Washburn et al. 1993 PASE scoring for item 2 (walking outside the home), as walking_validation"

[pase.walker_threshold]
value = 0.0
status = "assumed"
source = "As walking_validation: a PASE walker reports any walking outside the home in the past 7 days (subscore > 0)"

[pase.frequent_days_code]
value = 2
status = "assumed"
source = "As walking_validation components.pase_frequency_cuts: PASE item 2 days code >= 2 = walking on at least 3-4 days"
rationale = "A frequency-restricted PASE walker, reported beside 'any walking'."
choices = [1, 2, 3]

[pase.visits]
value = ["06", "08", "10"]
status = "assumed"
source = "PASE at 48, 72 and 96 months: the two device waves and the visit of the walking question"

[pase.device_pairing]
value = "adjacent_wave"
status = "assumed"
source = "As walking_validation pase.device_pairing: PASE at 48 and 72 months against the same visit's device wave; PASE at 96 months against the mean over valid waves"
choices = ["adjacent_wave", "two_wave_mean"]

[validity.auc_measures]
value = ["counts_per_day", "mv_min", "purposeful_min", "steps", "peak_cadence", "cadence40_min", "cadence60_min", "cadence100_min", "step_bout40_min", "step_bout60_min", "step_bout100_min"]
status = "assumed"
source = "Every continuous count and step measure: AUC for each yes/no self-report, Spearman with the PASE walking subscore"

[validity.bootstrap_reps]
value = 1000
status = "assumed"
source = "As walking_validation validity.bootstrap_reps (AUC percentile bootstrap, stratified by self-report)"

[validity.seed]
value = 20261112
status = "assumed"
source = "Fixed seed for the AUC bootstrap"

[variants.primary_cadence_60]
description = "Headline walking minute = >= 60 steps/min (slow walking)"
set = { "walking.primary_cadence" = 60 }

[variants.primary_cadence_100]
description = "Headline walking minute = >= 100 steps/min (moderate intensity)"
set = { "walking.primary_cadence" = 100 }

[variants.any_step_day]
description = "Count a person with at least one complete step day"
set = { "sample.min_step_days" = 1 }

[variants.pase_two_wave_mean]
description = "Every PASE visit against the mean over valid device waves"
set = { "pase.device_pairing" = "two_wave_mean" }

[variants.yes_without_amount_as_walker]
description = "A 96-month 'yes' with no amount answers counts as a walker"
set = { "exposure.yes_without_amount_as" = "walker" }
