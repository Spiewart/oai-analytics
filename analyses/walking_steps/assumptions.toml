# Assumptions for walking from per-minute steps: how much of the GT1M activity counts is walking,
# and how self-reported walking (the 96-month item, PASE walking at 48, 72 and 96 months)
# agrees with count-based and step-based device walking.
# Per-minute steps (oai.steps) classify each wear minute as walking or not; the step
# reports what share of the count-based measures fall in walking minutes.
# Wear, intensity and bout rules are the release's, as in analyses/walking_validation.

[device.nonwear_minutes]
value = 90
status = "confirmed"
source = "AccelData_Descrip.pdf (non-wear >90 zero minutes); >= 90 within each calendar day reproduces the release's by-day files"
rationale = "Validated for knee-OA wear patterns; 60 is the NHANES rule"
alternatives = [60]

[device.interrupt_minutes]
value = 2
status = "confirmed"
source = "AccelData_Descrip.pdf: interruptions of up to 2 consecutive minutes"

[device.interrupt_ceiling]
value = 100
status = "confirmed"
source = "AccelData_Descrip.pdf: interruptions have counts < 100"

[device.valid_day_hours]
value = 10.0
status = "confirmed"
source = "AccelData_Descrip.pdf: valid day = >= 10 wear hours"

[device.max_valid_days]
value = 7
status = "confirmed"
source = "AccelData_Descrip.pdf: only the first 7 valid days are used"

[device.min_valid_days]
value = 4
status = "confirmed"
source = "Accelerometry_Descrip.pdf: 4-7 valid days"

[device.mv_cutpoint]
value = 2020
status = "confirmed"
source = "Troiano 2008 cutpoint, as in the release"

[device.light_floor]
value = 100
status = "confirmed"
source = "Troiano 2008 light intensity 100-2019 counts/min, as in the release"

[device.bout_window]
value = 10
status = "confirmed"
source = "AccelData_Descrip.pdf: MV bout rolling window of 10 minutes"

[device.bout_need]
value = 8
status = "confirmed"
source = "AccelData_Descrip.pdf: a bout is established when 8 of 10 minutes are at or above the cutpoint"

[device.bout_stop_below]
value = 3
status = "confirmed"
source = "AccelData_Descrip.pdf: the bout stops when 3 minutes in the 10-minute window are below the cutpoint"

[device.purposeful_bout_minutes]
value = 10
status = "assumed"
source = "Spec 5: purposeful walking proxy = minutes in >= 10-minute MV bouts"


[steps.day_rule]
value = "complete"
status = "confirmed"
source = "User decision 2026-11-12 (oai.derive.accel.step_day_usable)"
rationale = "A valid day with any wear minute lacking steps is left out of the step analysis; 4 valid days across both waves are partly missing. Days are still chosen by wear alone."
choices = ["complete"]

[sample.min_step_days]
value = 4
status = "assumed"
source = "Mirrors device.min_valid_days: a person counts when at least this many of their first valid days have complete steps"
rationale = "Keeps the per-person shares on the same footing as the release's valid-person rule."
alternatives = [1]
choices = [1, 4]

[walking.cadences]
value = [1, 20, 40, 60, 80, 100]
status = "assumed"
source = "Tudor-Locke & Rowe 2012 (Sports Med 42:381, doi:10.2165/11599170-000000000-00000): NHANES cadence bands 0, 1-59, 60-79, 80-99, 100-119, 120+; 100 steps/min ~ moderate intensity (>= 3 METs). 20 and 40 split the 1-59 band"
rationale = "Every share is reported at each threshold, so no single definition of a walking minute is built into the outputs."

[walking.primary_cadence]
value = 40
status = "open"
source = "No published threshold for a walking minute; 60 = the lowest NHANES walking band and 100 = moderate intensity (Tudor-Locke & Rowe 2012). 40 is this ledger's choice, to allow for minutes only partly spent walking"
rationale = "The threshold used for the headline sentence in WALKING_SHARE.md. A minute only partly spent walking shows a diluted cadence (30 s at 100 steps/min records 50 steps), so higher thresholds understate walking."
alternatives = [60, 100]
choices = [40, 60, 100]

[walking.band_edges]
value = [1, 20, 40, 60, 80, 100, 120]
status = "assumed"
source = "20-step bands: Tudor-Locke & Rowe 2012's 60-79 to 120+ bands, with 1-59 split at 20 and 40"
rationale = "Lower edges of the cadence bands in cadence_bands.csv; 0 steps is its own band."

[relation.count_bin_edges]
value = [0, 100, 500, 1000, 1500, 2020, 5999]
status = "confirmed"
source = "User's choice (2026-11-13): sedentary < 100, light 100-2019 in four equal-width bins, moderate 2020-5998, vigorous >= 5999 (Troiano 2008 vigorous cutpoint)"
rationale = "Lower edges of the activity-count bins for the steps-vs-counts plots (step relation). Must include device.light_floor and device.mv_cutpoint."

[relation.vigorous_cutpoint]
value = 5999
status = "confirmed"
source = "Troiano 2008 vigorous cutpoint (>= 5999 counts/min), the user's choice (2026-11-13); relation.count_bin_edges must end at it"

[relation.hex_x_quantile]
value = 0.999
status = "assumed"
source = "The hexbin x-axis stops at this quantile of wear-minute counts per wave; the share of minutes beyond is reported"

[relation.hex_gridsize]
value = 50
status = "assumed"
source = "Hexagons across the hexbin x-axis; rows = round(50 / sqrt(3))"

[relation.hex_min_people]
value = 10
status = "assumed"
source = "As walking_validation components.min_cell_count: hexagons with minutes from fewer participants are not written (their share is reported as share_suppressed), so the hexbin stays aggregate"

[reference.step_cadences]
value = [40, 60, 100]
status = "assumed"
source = "Step walking bouts at three cadences: 40 (this ledger's walking minute), 60 (lowest NHANES walking band) and 100 steps/min (moderate intensity; Tudor-Locke & Rowe 2012)"
rationale = "Every cadence is reported beside the count-based MV bouts, so no single step definition is built in."

[reference.min_bout_days_per_week]
value = 2.0
status = "assumed"
source = "As walking_validation reference.min_bout_days_per_week (device habitual walker = >= 2 bout-days per valid week)"

[reference.min_bout_minutes_per_week]
value = 150.0
status = "assumed"
source = "As walking_validation reference.min_bout_minutes_per_week (DHHS 2008 aerobic guideline volume)"

[exposure.yes_without_amount_as]
value = "non-walker"
status = "open"
source = "As walking_validation exposure.yes_without_amount_as (reproduces Lo 2022's 887 walkers); question for the original authors in TODO.md"
choices = ["walker", "non-walker", "exclude"]

[pase.walking_scoring]
value = { days = [0.0, 1.5, 3.5, 6.0], hours = [0.5, 1.5, 3.0, 5.0], weight = 20.0 }
status = "assumed"
source = "Washburn et al. 1993 PASE scoring for item 2 (walking outside the home), as walking_validation"

[pase.walker_threshold]
value = 0.0
status = "assumed"
source = "As walking_validation: a PASE walker reports any walking outside the home in the past 7 days (subscore > 0)"

[pase.frequent_days_code]
value = 2
status = "assumed"
source = "As walking_validation components.pase_frequency_cuts: PASE item 2 days code >= 2 = walking on at least 3-4 days"
rationale = "A frequency-restricted PASE walker, reported beside 'any walking'."
choices = [1, 2, 3]

[pase.visits]
value = ["06", "08", "10"]
status = "assumed"
source = "PASE at 48, 72 and 96 months: the two device waves and the visit of the walking question"

[pase.device_pairing]
value = "adjacent_wave"
status = "assumed"
source = "As walking_validation pase.device_pairing: PASE at 48 and 72 months against the same visit's device wave; PASE at 96 months against the mean over valid waves"
choices = ["adjacent_wave", "two_wave_mean"]

[validity.auc_measures]
value = ["counts_per_day", "mv_min", "purposeful_min", "steps", "peak_cadence", "cadence40_min", "cadence60_min", "cadence100_min", "step_bout40_min", "step_bout60_min", "step_bout100_min"]
status = "assumed"
source = "Every continuous count and step measure: AUC for each yes/no self-report, Spearman with the PASE walking subscore"

[validity.bootstrap_reps]
value = 1000
status = "assumed"
source = "As walking_validation validity.bootstrap_reps (AUC percentile bootstrap, stratified by self-report)"

[validity.seed]
value = 20261112
status = "assumed"
source = "Fixed seed for the AUC bootstrap"

[discordance.comparisons]
value = { primary = ["item96", "steps_100:bout_days", "mean"], counts_mv = ["item96", "counts_mv:bout_days", "mean"], pase48 = ["pase06_any", "steps_100:bout_days", "06"] }
status = "confirmed"
source = "Primary comparison: the user's choice (2026-11-16); the counts_mv and 48-month PASE replications: Claude's choice"
rationale = "Each is (self-report id, device walker definition, device basis)."

[discordance.anchor_visit]
value = "06"
status = "assumed"
source = "The 48-month visit, the first with step data, anchors the group comparison"

[discordance.change_windows]
value = [["00", "06"], ["06", "10"]]
status = "assumed"
source = "Change in covariates from baseline to the anchor visit, and from the anchor visit to 96 months"

[discordance.nearest_visit_steps]
value = 1
status = "assumed"
source = "A covariate is taken from the nearest visit within this many visit steps of the one wanted"

[discordance.smd_bands]
value = { small = 0.1, lead = 0.2 }
status = "assumed"
source = "Standardised mean differences below small are called negligible; at or above lead they lead the readout"

[discordance.bootstrap_reps]
value = 1000
status = "assumed"
source = "Percentile bootstrap replicates for confidence intervals"

[discordance.seed]
value = 20261116
status = "assumed"
source = "Fixed seed for the discordance bootstrap"

[discordance.trend_visits]
value = ["00", "01", "03", "05", "06", "08", "10"]
status = "assumed"
source = "Visits at which PASE and walking-related covariates are followed over time"

[discordance.trend_covariates]
value = ["age0", "sex"]
status = "assumed"
source = "Adjustment covariates for the group trends"

[discordance.multiplicity]
value = "holm"
status = "assumed"
source = "Holm adjustment across the covariate comparisons"

[discordance.replacement]
value = "keep_kl4"
status = "confirmed"
source = "User's choice (2026-11-16): a knee replacement keeps the knee's last KL grade 4 rather than censoring"
choices = ["keep_kl4", "censor"]

[discordance.kl_coverage_gap]
value = 0.10
status = "assumed"
source = "A group's KL-grade coverage may differ from the others by up to this share before the comparison is flagged"

[discordance.employed_codes]
value = [1, 2]
status = "assumed"
source = "AllClinical V##CEMPLOY (EMPLOY): 1 works for pay, 2 unpaid work for family business, 3 not working in part due to health, 4 not working for other reasons"
rationale = "Employed = working, paid or unpaid; refused or missing stay null"

# Knee outcome keys read by oai.derive.knee_outcomes.knee_status (KL and replacement for the
# discordance long table), copied with their values from analyses/steps_oa/assumptions.toml.

[cohort.side]
value = "R"
status = "confirmed"
source = "Copied from analyses/steps_oa/assumptions.toml. Lo 2018 Methods, Study Design: right knee only (GEE adjusts for one clustering level)"
choices = ["R", "L"]

[cohort.reading_project]
value = 15
status = "assumed"
source = "Copied from analyses/steps_oa/assumptions.toml. Lo 2018 Methods: central readers; Project 15 reproduces the 877 baseline right-knee SOA exclusion exactly"
alternatives = [37, 43]

[outcomes.pain_baseline_item]
value = "P01KP{side}12CV"
status = "assumed"
source = "Copied from analyses/steps_oa/assumptions.toml. Lo 2018 Methods quote the 12-month frequent-pain question; screening-visit item, as in analyses/lo2022_walking"

[outcomes.pain_followup_item]
value = "V{visit}KP{side}12CV"
status = "assumed"
source = "Copied from analyses/steps_oa/assumptions.toml. Lo 2018 Methods: symptoms at 12, 24, 36, 48 months; AllClinical follow-up item"

[outcomes.roa_rule]
value = "same_visit"
status = "open"
source = "Copied from analyses/steps_oa/assumptions.toml. Lo 2018 Methods: ROA = tibiofemoral KL >= 2; whether ROA is carried forward once seen is not stated"
choices = ["same_visit", "ever"]

[outcomes.arthroplasty_scope]
value = "right"
status = "open"
source = "Copied from analyses/steps_oa/assumptions.toml. Lo 2018 Methods: 'Any participant with a knee arthroplasty was identified as having Sx, ROA, and SOA'"
rationale = "'Any participant' could mean a replacement in either knee"
choices = ["right", "either"]

[outcomes.arthroplasty_timing]
value = "by_visit_days"
status = "assumed"
source = "Copied from analyses/steps_oa/assumptions.toml. A replacement counts from the first outcome visit whose V##VISDYS is on or after the replacement day"
choices = ["by_visit_days"]

[outcomes.soa_missing]
value = "both_required"
status = "open"
source = "Copied from analyses/steps_oa/assumptions.toml. Lo 2018 does not say whether SOA is missing or known absent when one component (pain or KL) is missing"
rationale = "known_false: no frequent pain (or KL < 2) rules SOA out even if the other component is missing"
choices = ["both_required", "known_false"]

[outcomes.replacement_counts]
value = "adjudicated_or_self_report"
status = "open"
source = "Copied from analyses/steps_oa/assumptions.toml. oai.derive.knee.REPLACEMENT_STATUS_COUNTS (from Lo 2022 p.1661): V99E*RPCF of 1 (self-reported) or 3 (adjudicated, confirmed), or RPSN = 1 (seen on a follow-up X-ray). Lo 2018 says only 'any participant with a knee arthroplasty'"
rationale = "A counted replacement with no day count (V99E*DAYS blank) never becomes SOA at a follow-up visit"
choices = ["adjudicated_or_self_report"]

[outcomes.missing_visit_days]
value = "nominal_month"
status = "assumed"
source = "Copied from analyses/steps_oa/assumptions.toml. When a participant has no V##VISDYS for an outcome visit, the replacement-timing check uses the visit's nominal month (config/oai.toml [visits]) in days"
choices = ["nominal_month"]

[outcomes.roa_source]
value = "outcomes99"
status = "assumed"
source = "Copied from analyses/steps_oa/assumptions.toml. kXR_SQ_BU_Descrip.pdf sections 1.3 and Appendix B recommend the OUTCOMES99 summary variables (V99E?XIOA) over merging reading projects by hand"
rationale = "Earliest visit with KL >= 2 from Projects 15, 37 and 43, carried forward; readings (Project 15, same visit) is refused past 48 months"
choices = ["readings", "outcomes99"]

[outcomes.roa_definition]
value = "kl2"
status = "open"
source = "Copied from analyses/steps_oa/assumptions.toml. OUTCOMES99 offers incident KL >= 2 (V99E?XIOA) and incident KL >= 2 with JSN (V99E?XIOAN); Lo 2018 used KL >= 2"
choices = ["kl2", "kl2_jsn"]

[outcomes.roa_unread]
value = "unknown"
status = "assumed"
source = "Copied from analyses/steps_oa/assumptions.toml. OUTCOMES99 'no incidence' (V99E?XIOA = 2) holds only while the knee was read; V99E?XNOA gives the last visit with no ROA"
rationale = "unknown: after that visit (and between it and an incident visit) ROA is missing; no_roa: taken as absent (the first version of this analysis)"
choices = ["unknown", "no_roa"]

[outcomes.roa_replacement]
value = "event"
status = "assumed"
source = "Copied from analyses/steps_oa/assumptions.toml. Value names as in analyses/luyten_early_oa: a knee replacement is a radiographic OA event"
rationale = "event: a replaced knee counts as having ROA (and SOA) from its replacement; ignore: replacement does not make a knee a case"
choices = ["event", "ignore"]

[periods.horizon]
value = "10"
status = "confirmed"
source = "Copied from analyses/steps_oa/assumptions.toml. User decision 2026-11-12: follow incidence and progression from 48 months (V06) to 96 months (V10), the end of the complete reading projects"
rationale = "10: 96 months; 12 (120 months) depends on Project 43, whose selection the release does not document, and only 3,435 knees were read at V12"
choices = ["10", "12"]

[readings.anchor_project]
value = "followup"
status = "assumed"
source = "Copied from analyses/steps_oa/assumptions.toml. Controller ruling 2026-11-12 (knee_outcomes module): grades at the 48-month anchor visit come from the follow-up reading project where it re-read the anchor film"
rationale = "followup: the follow-up reading project's reading of the anchor film where one exists, else Project 15, so anchor and follow-up grades come from the same readers; p15: Project 15 only"
choices = ["followup", "p15"]

[readings.followup_project]
value = "latest"
status = "open"
source = "Copied from analyses/steps_oa/assumptions.toml. Projects 37 and 43 (READPRJ 42 recoded to 37): follow-up films (72 and 96 months) were read in Project 37 (some by Project 42); which project's grade counts is not fixed by the release"
rationale = "latest: Project 43 where it read the film, else Project 37 (the module's FOLLOWUP_PROJECTS); p37: Project 37 only"
choices = ["latest", "p37"]

[variants.primary_cadence_60]
description = "Headline walking minute = >= 60 steps/min (slow walking)"
set = { "walking.primary_cadence" = 60 }

[variants.primary_cadence_100]
description = "Headline walking minute = >= 100 steps/min (moderate intensity)"
set = { "walking.primary_cadence" = 100 }

[variants.any_step_day]
description = "Count a person with at least one complete step day"
set = { "sample.min_step_days" = 1 }

[variants.pase_two_wave_mean]
description = "Every PASE visit against the mean over valid device waves"
set = { "pase.device_pairing" = "two_wave_mean" }

[variants.yes_without_amount_as_walker]
description = "A 96-month 'yes' with no amount answers counts as a walker"
set = { "exposure.yes_without_amount_as" = "walker" }

[variants.replacement_censor]
description = "A knee replacement censors the knee instead of keeping KL grade 4"
set = { "discordance.replacement" = "censor" }
