# Assumptions for crepitus within Luyten 2018 early-stage knee OA.
# Spec: docs/superpowers/specs/2026-10-22-luyten-early-oa-design.md
# Keys shared with analyses/crepitus_soa_longterm/assumptions.toml are copied verbatim and must stay
# identical to it (tests/test_luyten_definition.py). cohort.side is not a key: the analysis runs
# oai.derive.incident_soa once per knee with the side set (luyten.for_side).
# Mahmoudian A et al., Semin Arthritis Rheum 2021;51:285-91 (doi:10.1016/j.semarthrit.2020.11.002),
# abstract only (no open-access full text).

[cohort.knees]
value = "both"
status = "confirmed"
source = "Mahmoudian 2021 abstract: 1,315 knees (27%) met the criteria; the unit is the knee"
choices = ["both", "right"]

[cohort.cohorts]
value = "all"
status = "assumed"
source = "Mahmoudian 2021 abstract: 'the OAI comprises data of 4796 men and women'; no cohort restriction stated"
choices = ["all", "progression_incidence"]

[outcomes.arthroplasty_scope]
value = "knee"
status = "assumed"
source = "A knee-level analysis: the knee's own replacement counts (soa_status treats any value but 'either' as the knee's side)"
choices = ["knee", "either"]

[outcomes.roa_replacement]
value = "event"
status = "assumed"
source = "Replacing a KL 0-1 knee during follow-up implies it progressed; soa_status already counts a replacement as SOA"
rationale = "ignore: the ROA outcome uses OUTCOMES99 incidence only, so a replaced knee is usually unknown after its last reading"
choices = ["event", "ignore"]

[periods.horizon]
value = "10"
status = "confirmed"
source = "Spec: outcomes by 48 (V06) and 96 months (V10); Mahmoudian 2021 reports 48 and 96 months"
choices = ["06", "10"]

[luyten.kl_source]
value = "project15"
status = "assumed"
source = "Baseline tibiofemoral KL from the Project 15 central reading, as in the other crepitus analyses; Mahmoudian 2021 does not say (abstract)"
rationale = "outcomes99: V99E?XIOA = 1 is KL >= 2 at baseline, 2-9 is KL 0-1; it covers knees Project 15 did not read"
choices = ["project15", "outcomes99"]

[luyten.koos_cutoff]
value = 85
status = "confirmed"
source = "Mahmoudian 2021 abstract: 'two out of four KOOS subscales equal or less than 85'"

[luyten.koos_min]
value = 2
status = "confirmed"
source = "Luyten 2018 and Mahmoudian 2021: two of four subscales (pain, symptoms, function in daily living, quality of life)"

[luyten.adl_source]
value = "womac_function"
status = "assumed"
source = "The OAI release has no KOOS function-in-daily-living subscale; it is the 17 WOMAC function items, so KOOS ADL = 100 - V00WOMADL{side} x 100 / 68"
rationale = "omit: count only pain, symptoms and quality of life, still needing two"
choices = ["womac_function", "omit"]

[luyten.koos_missing]
value = "not_met"
status = "open"
source = "Mahmoudian 2021 (abstract) does not say how a missing KOOS subscale was handled"
rationale = "not_met: a missing subscale is not <= 85, so the knee needs two of the others; exclude: the knee leaves the KL 0-1 denominator"
choices = ["not_met", "exclude"]

[luyten.sign_missing]
value = "not_met"
status = "open"
source = "Mahmoudian 2021 (abstract) does not say how a missing crepitus or joint-line tenderness exam was handled"
rationale = "not_met: a missing sign is absent, so another sign can still meet the criterion; exclude: a knee with any sign missing and none present leaves the denominator"
choices = ["not_met", "exclude"]

[exposure.s2_coding]
value = "any"
status = "assumed"
source = "Within about 1,100 knees five S2 levels are sparse; any = at least rarely (KOOS S2 >= 1) vs never"
choices = ["any", "levels"]

[model.covariates]
value = ["age", "sex", "bmi"]
status = "confirmed"
source = "Spec: Model 1 adjusts for age, sex and BMI, the covariates of Lo 2018 and the other crepitus analyses"

[cohort.reading_project]
value = 15
status = "assumed"
source = "Lo 2018 Methods: central readers; Project 15 reproduces the 877 baseline right-knee SOA exclusion exactly"
alternatives = [37, 43]

[outcomes.pain_baseline_item]
value = "P01KP{side}12CV"
status = "assumed"
source = "Lo 2018 Methods quote the 12-month frequent-pain question; screening-visit item, as in analyses/lo2022_walking"

[outcomes.pain_followup_item]
value = "V{visit}KP{side}12CV"
status = "assumed"
source = "Lo 2018 Methods: symptoms at 12, 24, 36, 48 months; AllClinical follow-up item"

[outcomes.roa_rule]
value = "same_visit"
status = "open"
source = "Lo 2018 Methods: ROA = tibiofemoral KL >= 2; whether ROA is carried forward once seen is not stated"
choices = ["same_visit", "ever"]

[outcomes.arthroplasty_timing]
value = "by_visit_days"
status = "assumed"
source = "A replacement counts from the first outcome visit whose V##VISDYS is on or after the replacement day"
choices = ["by_visit_days"]

[outcomes.soa_missing]
value = "both_required"
status = "open"
source = "Lo 2018 does not say whether SOA is missing or known absent when one component (pain or KL) is missing"
rationale = "known_false: no frequent pain (or KL < 2) rules SOA out even if the other component is missing"
choices = ["both_required", "known_false"]

[outcomes.replacement_counts]
value = "adjudicated_or_self_report"
status = "open"
source = "oai.derive.knee.REPLACEMENT_STATUS_COUNTS (from Lo 2022 p.1661): V99E*RPCF of 1 (self-reported) or 3 (adjudicated, confirmed), or RPSN = 1 (seen on a follow-up X-ray). Lo 2018 says only 'any participant with a knee arthroplasty'"
rationale = "A counted replacement with no day count (V99E*DAYS blank) never becomes SOA at a follow-up visit"
choices = ["adjudicated_or_self_report"]

[outcomes.missing_visit_days]
value = "nominal_month"
status = "assumed"
source = "When a participant has no V##VISDYS for an outcome visit, the replacement-timing check uses the visit's nominal month (config/oai.toml [visits]) in days"
choices = ["nominal_month"]

[outcomes.roa_source]
value = "outcomes99"
status = "assumed"
source = "kXR_SQ_BU_Descrip.pdf sections 1.3 and Appendix B recommend the OUTCOMES99 summary variables (V99E?XIOA) over merging reading projects by hand"
rationale = "Earliest visit with KL >= 2 from Projects 15, 37 and 43, carried forward; readings (Project 15, same visit) is refused past 48 months"
choices = ["readings", "outcomes99"]

[outcomes.roa_definition]
value = "kl2"
status = "open"
source = "OUTCOMES99 offers incident KL >= 2 (V99E?XIOA) and incident KL >= 2 with JSN (V99E?XIOAN); Lo 2018 used KL >= 2"
choices = ["kl2", "kl2_jsn"]

[outcomes.roa_unread]
value = "unknown"
status = "assumed"
source = "OUTCOMES99 'no incidence' (V99E?XIOA = 2) holds only while the knee was read; V99E?XNOA gives the last visit with no ROA"
rationale = "unknown: after that visit (and between it and an incident visit) ROA is missing; no_roa: taken as absent (the first version of this analysis)"
choices = ["unknown", "no_roa"]

[horizon.selection]
value = "known_or_case"
status = "open"
source = "Spec decision 5: L3 keeps people whose outcome at the horizon is known or who became cases earlier"
rationale = "known_or_case keeps cases who left and drops non-cases who left (favours cases); complete keeps only people with a known outcome at the horizon. Lo 2018's four-year table counted missing outcomes as non-events. L2 is the censoring-robust estimate."
choices = ["known_or_case", "complete"]

[model.corstr]
value = "exchangeable"
status = "confirmed"
source = "Lo 2018 Methods, Statistical analysis: GEE with an exchangeable correlation structure"
choices = ["exchangeable", "independence"]

[variants.right_knee]
description = "Right knees only"
set = { "cohort.knees" = "right" }

[variants.progression_incidence]
description = "Progression and Incidence cohorts only (no Non-exposed controls)"
set = { "cohort.cohorts" = "progression_incidence" }

[variants.kl_outcomes99]
description = "Baseline KL 0-1 from OUTCOMES99 (V99E?XIOA != 1)"
set = { "luyten.kl_source" = "outcomes99" }

[variants.adl_omitted]
description = "KOOS criterion over pain, symptoms and quality of life only"
set = { "luyten.adl_source" = "omit" }

[variants.koos_missing_exclude]
description = "A knee with a missing KOOS subscale leaves the denominator"
set = { "luyten.koos_missing" = "exclude" }

[variants.sign_missing_exclude]
description = "A knee with a missing clinical sign and none present leaves the denominator"
set = { "luyten.sign_missing" = "exclude" }

[variants.s2_levels]
description = "Self-reported crepitus as five levels (never to always)"
set = { "exposure.s2_coding" = "levels" }

[variants.horizon_complete]
description = "Only knees whose outcome at the horizon is known"
set = { "horizon.selection" = "complete" }

[variants.roa_kl2_jsn]
description = "ROA = incident KL >= 2 with JSN (V99E?XIOAN)"
set = { "outcomes.roa_definition" = "kl2_jsn" }

[variants.roa_replacement_ignore]
description = "A knee replacement does not count as incident KL >= 2"
set = { "outcomes.roa_replacement" = "ignore" }
