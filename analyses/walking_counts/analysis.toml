name = "walking_counts"
description = "How much of the OAI GT1M activity counts (total, MV minutes, MV bouts) comes from walking, judged by per-minute steps at 48 and 72 months."

[inputs]
# The per-minute steps are not a release table: they are read from OAI_STEPS_DIR (oai.steps).
tables = ["acceldatabymin:06", "acceldatabymin:08"]

[[steps]]
id = "share"
lang = "python"
stage = "local"
entry = "walking_share.py"

[outputs]
aggregate = ["*.csv", "WALKING_SHARE.md", "assumptions.resolved.json"]
