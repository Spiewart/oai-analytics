# Assumptions for "how much of the GT1M activity counts is walking".
# Per-minute steps (oai.steps) classify each wear minute as walking or not; the step
# reports what share of the count-based measures fall in walking minutes.
# Wear, intensity and bout rules are the release's, as in analyses/walking_validation.

[device.nonwear_minutes]
value = 90
status = "confirmed"
source = "AccelData_Descrip.pdf (non-wear >90 zero minutes); >= 90 within each calendar day reproduces the release's by-day files"
rationale = "Validated for knee-OA wear patterns; 60 is the NHANES rule"
alternatives = [60]

[device.interrupt_minutes]
value = 2
status = "confirmed"
source = "AccelData_Descrip.pdf: interruptions of up to 2 consecutive minutes"

[device.interrupt_ceiling]
value = 100
status = "confirmed"
source = "AccelData_Descrip.pdf: interruptions have counts < 100"

[device.valid_day_hours]
value = 10.0
status = "confirmed"
source = "AccelData_Descrip.pdf: valid day = >= 10 wear hours"

[device.max_valid_days]
value = 7
status = "confirmed"
source = "AccelData_Descrip.pdf: only the first 7 valid days are used"

[device.min_valid_days]
value = 4
status = "confirmed"
source = "Accelerometry_Descrip.pdf: 4-7 valid days"

[device.mv_cutpoint]
value = 2020
status = "confirmed"
source = "Troiano 2008 cutpoint, as in the release"

[device.light_floor]
value = 100
status = "confirmed"
source = "Troiano 2008 light intensity 100-2019 counts/min, as in the release"

[device.bout_window]
value = 10
status = "confirmed"
source = "AccelData_Descrip.pdf: MV bout rolling window of 10 minutes"

[device.bout_need]
value = 8
status = "confirmed"
source = "AccelData_Descrip.pdf: a bout is established when 8 of 10 minutes are at or above the cutpoint"

[device.bout_stop_below]
value = 3
status = "confirmed"
source = "AccelData_Descrip.pdf: the bout stops when 3 minutes in the 10-minute window are below the cutpoint"

[device.purposeful_bout_minutes]
value = 10
status = "assumed"
source = "Spec 5: purposeful walking proxy = minutes in >= 10-minute MV bouts"


[steps.day_rule]
value = "complete"
status = "confirmed"
source = "User decision 2026-11-12 (oai.derive.accel.step_day_usable)"
rationale = "A valid day with any wear minute lacking steps is left out of the step analysis; 4 valid days across both waves are partly missing. Days are still chosen by wear alone."
choices = ["complete"]

[sample.min_step_days]
value = 4
status = "assumed"
source = "Mirrors device.min_valid_days: a person counts when at least this many of their first valid days have complete steps"
rationale = "Keeps the per-person shares on the same footing as the release's valid-person rule."
alternatives = [1]
choices = [1, 4]

[walking.cadences]
value = [1, 20, 40, 60, 80, 100]
status = "assumed"
source = "Tudor-Locke & Rowe 2012 (Sports Med 42:381, doi:10.2165/11599170-000000000-00000): NHANES cadence bands 0, 1-59, 60-79, 80-99, 100-119, 120+; 100 steps/min ~ moderate intensity (>= 3 METs). 20 and 40 split the 1-59 band"
rationale = "Every share is reported at each threshold, so no single definition of a walking minute is built into the outputs."

[walking.primary_cadence]
value = 40
status = "open"
source = "No published threshold for a walking minute; 60 = the lowest NHANES walking band and 100 = moderate intensity (Tudor-Locke & Rowe 2012). 40 is this ledger's choice, to allow for minutes only partly spent walking"
rationale = "The threshold used for the headline sentence in WALKING_SHARE.md. A minute only partly spent walking shows a diluted cadence (30 s at 100 steps/min records 50 steps), so higher thresholds understate walking."
alternatives = [60, 100]
choices = [40, 60, 100]

[walking.band_edges]
value = [1, 20, 40, 60, 80, 100, 120]
status = "assumed"
source = "20-step bands: Tudor-Locke & Rowe 2012's 60-79 to 120+ bands, with 1-59 split at 20 and 40"
rationale = "Lower edges of the cadence bands in cadence_bands.csv; 0 steps is its own band."

[variants.primary_cadence_60]
description = "Headline walking minute = >= 60 steps/min (slow walking)"
set = { "walking.primary_cadence" = 60 }

[variants.primary_cadence_100]
description = "Headline walking minute = >= 100 steps/min (moderate intensity)"
set = { "walking.primary_cadence" = 100 }

[variants.any_step_day]
description = "Count a person with at least one complete step day"
set = { "sample.min_step_days" = 1 }
