# Assumptions for palpable crepitus -> incident symptomatic OA, and the Mahmoudian 2023 anchor.
# Spec: docs/superpowers/specs/2026-10-21-exam-crepitus-incident-soa-design.md
# Keys from cohort.* to model.missing_covariates are copied from analyses/lo2018_crepitus/assumptions.toml
# and must stay identical to it (tests/test_exam_soa_definition.py).

[cohort.side]
value = "R"
status = "confirmed"
source = "Lo 2018 Methods, Study Design: right knee only (GEE adjusts for one clustering level)"
choices = ["R", "L"]

[cohort.reading_project]
value = 15
status = "assumed"
source = "Lo 2018 Methods: central readers; Project 15 reproduces the 877 baseline right-knee SOA exclusion exactly"
alternatives = [37, 43]

[cohort.arthroplasty_scope]
value = "right"
status = "assumed"
source = "Lo 2018 Results: 35 excluded with arthroplasty at enrollment; right knee gives 38, either knee 63"
choices = ["right", "either"]

[cohort.missing_baseline_pain]
value = "not_sx"
status = "open"
source = "Lo 2018 Results list no exclusion for a blank baseline frequent-pain answer (26 people)"
rationale = "not_sx keeps them, counted as without frequent symptoms at baseline"
choices = ["not_sx", "exclude"]

[outcomes.pain_baseline_item]
value = "P01KP{side}12CV"
status = "assumed"
source = "Lo 2018 Methods quote the 12-month frequent-pain question; screening-visit item, as in analyses/lo2022_walking"

[outcomes.pain_followup_item]
value = "V{visit}KP{side}12CV"
status = "assumed"
source = "Lo 2018 Methods: symptoms at 12, 24, 36, 48 months; AllClinical follow-up item"

[outcomes.roa_rule]
value = "same_visit"
status = "open"
source = "Lo 2018 Methods: ROA = tibiofemoral KL >= 2; whether ROA is carried forward once seen is not stated"
choices = ["same_visit", "ever"]

[outcomes.arthroplasty_scope]
value = "right"
status = "open"
source = "Lo 2018 Methods: 'Any participant with a knee arthroplasty was identified as having Sx, ROA, and SOA'"
rationale = "'Any participant' could mean a replacement in either knee"
choices = ["right", "either"]

[outcomes.arthroplasty_timing]
value = "by_visit_days"
status = "assumed"
source = "A replacement counts from the first outcome visit whose V##VISDYS is on or after the replacement day"
choices = ["by_visit_days"]

[outcomes.soa_missing]
value = "both_required"
status = "open"
source = "Lo 2018 does not say whether SOA is missing or known absent when one component (pain or KL) is missing"
rationale = "known_false: no frequent pain (or KL < 2) rules SOA out even if the other component is missing"
choices = ["both_required", "known_false"]

[outcomes.replacement_counts]
value = "adjudicated_or_self_report"
status = "open"
source = "oai.derive.knee.REPLACEMENT_STATUS_COUNTS (from Lo 2022 p.1661): V99E*RPCF of 1 (self-reported) or 3 (adjudicated, confirmed), or RPSN = 1 (seen on a follow-up X-ray). Lo 2018 says only 'any participant with a knee arthroplasty'"
rationale = "A counted replacement with no day count (V99E*DAYS blank) never becomes SOA at a follow-up visit"
choices = ["adjudicated_or_self_report"]

[outcomes.missing_visit_days]
value = "nominal_month"
status = "assumed"
source = "When a participant has no V##VISDYS for an outcome visit, the replacement-timing check uses the visit's nominal month (config/oai.toml [visits]) in days"
choices = ["nominal_month"]

[periods.after_missing_outcome]
value = "continue"
status = "open"
source = "Lo 2018 Results: 750 of 11,994 potential observations missing the outcome were excluded; follow-up after them is not described"
choices = ["continue", "stop"]

[model.corstr]
value = "exchangeable"
status = "confirmed"
source = "Lo 2018 Methods, Statistical analysis: GEE with an exchangeable correlation structure"
choices = ["exchangeable", "independence"]

[model.covariates]
value = ["age", "sex", "bmi"]
status = "confirmed"
source = "Lo 2018 Methods: the adjusted model included age, sex, and BMI (BMI at baseline)"

[model.missing_covariates]
value = "complete_cases"
status = "assumed"
source = "Each model drops rows missing a covariate (models.R, dual.R); Lo 2018 does not say how missing age, sex or BMI were handled"
rationale = "Few rows (Table 1 never: 7,297 fitted of 7,300 observations)"
choices = ["complete_cases"]

[exposure.require_s2]
value = false
status = "assumed"
source = "Spec: a period needs an exam value, not S2; the require_s2 variant restricts to periods with both"

[mahmoudian.knee_pick]
value = "random"
status = "open"
source = "Mahmoudian 2023 OARSI abstract: one knee per subject randomly included if both were eligible"
rationale = "Their random draw cannot be reproduced; the seed fixes ours"
choices = ["random", "right", "left"]

[mahmoudian.seed]
value = 2023
status = "assumed"
source = "Any fixed seed; mahmoudian_right and mahmoudian_left show how much the pick matters"

[mahmoudian.jsn_rule]
value = "incident"
status = "open"
source = "Mahmoudian 2023: 'incidence of radiographic joint space narrowing (yes/no)' in either tibiofemoral compartment"
rationale = "incident: JSN grade 0 at baseline and >= 1 at V06 (a within-grade 0.5 is not incident); any_increase: the grade rises"
choices = ["incident", "any_increase"]

[mahmoudian.osteophyte_rule]
value = "sites"
status = "open"
source = "Mahmoudian 2023: 'increase (yes/no) in the number of osteophytes in either tibiofemoral compartment'"
rationale = "sites: more of the four OARSI sites (medial/lateral femur and tibia) graded >= 1; grade_sum: the sum of the four grades rises"
choices = ["sites", "grade_sum"]

[mahmoudian.missing_osteophytes]
value = "absent"
status = "open"
source = "Release check 2026-10-21: Project 15 osteophyte grades are blank in 78% of KL 0 and 47% of KL 1 baseline readings and never in KL >= 2; 99% of the KL 0-1 knees it graded are 0"
rationale = "absent: a blank grade in a KL 0-1 reading is no osteophyte; exclude: the knee has no structural outcome (keeps 309 of about 1,060 eligible subjects)"
choices = ["absent", "exclude"]

[mahmoudian.crepitus_knee]
value = "selected"
status = "open"
source = "Mahmoudian 2023 reports crepitus 'at baseline' without saying whether in the selected knee or either knee (45.8% with crepitus vs 34% here in the selected knee)"
choices = ["selected", "either"]

[mahmoudian.kl_level]
value = "knee"
status = "open"
source = "Mahmoudian 2023: 'subjects with K&L 0-1 ... in either knee at baseline'; knee = the included knee is KL 0-1; person = both knees are"
choices = ["knee", "person"]

[mahmoudian.reading_project]
value = 15
status = "assumed"
source = "As cohort.reading_project; Project 15 covers baseline to 48 months"
alternatives = [37, 43]

[mahmoudian.missing_followup_pain]
value = "exclude"
status = "open"
source = "Mahmoudian 2023 does not say how a blank 4-year frequent-pain answer was handled for the 'remaining symptomatic' outcome"
rationale = "exclude: such a subject leaves that model only; not_sx: counted as not symptomatic"
choices = ["exclude", "not_sx"]

[variants.require_s2]
description = "Periods and four-year rows need both the exam item and S2 (head-to-head on the same rows)"
set = { "exposure.require_s2" = true }

[variants.exclude_missing_pain]
description = "Blank baseline frequent pain excludes the person (as in Lo 2018)"
set = { "cohort.missing_baseline_pain" = "exclude" }

[variants.mahmoudian_right]
description = "Mahmoudian anchor: the right knee when both are eligible"
set = { "mahmoudian.knee_pick" = "right" }

[variants.mahmoudian_left]
description = "Mahmoudian anchor: the left knee when both are eligible"
set = { "mahmoudian.knee_pick" = "left" }

[variants.mahmoudian_any_jsn_increase]
description = "Mahmoudian anchor: any rise in JSN grade counts"
set = { "mahmoudian.jsn_rule" = "any_increase" }

[variants.mahmoudian_exclude_blank_osteophytes]
description = "Mahmoudian anchor: a knee with blank osteophyte grades has no structural outcome"
set = { "mahmoudian.missing_osteophytes" = "exclude" }

[variants.mahmoudian_crepitus_either_knee]
description = "Mahmoudian anchor: crepitus present in either knee"
set = { "mahmoudian.crepitus_knee" = "either" }

[variants.mahmoudian_person_kl]
description = "Mahmoudian anchor: both knees KL 0-1 at baseline"
set = { "mahmoudian.kl_level" = "person" }

[variants.mahmoudian_osteophyte_grade_sum]
description = "Mahmoudian anchor: a rise in the summed osteophyte grades counts"
set = { "mahmoudian.osteophyte_rule" = "grade_sum" }
