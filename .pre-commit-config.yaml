# Local hooks so ruff's version comes from uv.lock (single source of truth).
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff lint
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: check-no-data
        name: block OAI data from commits
        entry: uv run python scripts/check_no_data.py
        language: system
